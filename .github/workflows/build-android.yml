name: Build Android APK

# Builds a debug APK of the Cascade native shell (Capacitor wrapping the
# live site at capacitor.config.ts's server.url) and uploads it as a
# downloadable build artifact. Runs on GitHub's runners because Android's
# Gradle plugin needs dl.google.com, which most sandboxed dev environments
# block.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cascade-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
